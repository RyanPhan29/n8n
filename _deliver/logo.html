<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Noto+Serif:wght@600;700&display=swap&subset=vietnamese" rel="stylesheet" />
<style>
  :root{--maroon:#6e1414;--maroon-dark:#4d0d0d;--gold:#c9a227;--gold-light:#e3c558}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{font-family:'Be Vietnam Pro',sans-serif;
    background:radial-gradient(circle at 50% 38%,#7a1717,var(--maroon) 55%,var(--maroon-dark));
    display:grid;place-items:center;overflow:hidden}
  body.light{background:radial-gradient(circle at 50% 38%,#fffdf8,#faf3e6 60%,#f0e6d2)}
  .logo{display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px;padding:40px}
  /* Đỉnh tam giác: biểu trưng */
  .mark{width:230px;height:230px;flex:none;display:grid;place-items:center;
    border:5px solid var(--gold);border-radius:50%;
    background:radial-gradient(circle,rgba(201,162,39,.16),transparent 70%);
    box-shadow:0 0 0 12px rgba(201,162,39,.08)}
  .mark svg{width:130px;height:130px}
  .label{font-weight:600;letter-spacing:9px;font-size:30px;color:var(--gold-light)}
  body.light .label{color:var(--gold)}
  .divider{display:flex;align-items:center;gap:14px;color:var(--gold)}
  .divider .line{width:78px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
  .divider .line:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .divider .dot{transform:rotate(45deg);width:10px;height:10px;background:var(--gold)}
  /* Đáy tam giác: tên văn phòng */
  .name{font-family:'Noto Serif',serif;font-weight:700;font-size:66px;line-height:1.15;color:#fff;max-width:820px}
  body.light .name{color:var(--maroon-dark)}
</style></head>
<body>
  <div class="logo">
    <div class="mark">
      <!-- Cán cân công lý -->
      <svg viewBox="0 0 120 120" fill="none" stroke="#c9a227" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="18" r="5.5" fill="#c9a227" stroke="none"/>
        <line x1="60" y1="23" x2="60" y2="92"/>
        <line x1="24" y1="34" x2="96" y2="34"/>
        <line x1="24" y1="34" x2="14" y2="56"/>
        <line x1="24" y1="34" x2="34" y2="56"/>
        <path d="M11 56 q13 15 26 0"/>
        <line x1="96" y1="34" x2="86" y2="56"/>
        <line x1="96" y1="34" x2="106" y2="56"/>
        <path d="M83 56 q13 15 26 0"/>
        <line x1="46" y1="92" x2="74" y2="92"/>
        <path d="M40 102 L60 92 L80 102"/>
      </svg>
    </div>
    <div class="label">VĂN PHÒNG LUẬT SƯ</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
    <div class="name">Triều Nguyễn<br/>và Cộng sự</div>
  </div>
</body></html>
